name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref so pushes don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-tools
        run: python -m pip install --upgrade pip pip-tools==7.6.2

      - name: Validate lockfiles are up-to-date
        run: |
          pip-compile --quiet --strip-extras requirements.in --output-file requirements.lock
          pip-compile --quiet --strip-extras requirements-dev.in --output-file requirements-dev.lock
          git diff --exit-code requirements.lock requirements-dev.lock

  lint:
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock

      - name: Ruff lint
        run: ruff check src/forex_bot tests

  typecheck:
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock

      - name: Mypy
        run: >
          mypy --follow-imports=skip
          src/forex_bot/live_engine.py
          src/forex_bot/preflight.py
          src/forex_bot/execution/simulated.py
          src/forex_bot/startup_checks.py
          src/forex_bot/monitoring.py

  test:
    runs-on: ubuntu-latest
    needs: lockfile
    strategy:
      fail-fast: false
      matrix:
        # pyproject requires-python = ">=3.10"; test the supported range.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock

      - name: Run tests
        run: python -m pytest -q --cov=forex_bot --cov-report=term-missing --cov-fail-under=75

  dependency-security:
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit tool
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.1

      - name: Audit dependencies
        run: pip-audit -r requirements.lock

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
